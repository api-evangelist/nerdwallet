  content, and free credit-score monitoring. Founded in 2009 and headquartered in San Francisco,
  NerdWallet is publicly traded (NASDAQ: NRDS) and was surfaced in the API Evangelist network as a
  portfolio company of ivp. As of this enrichment pass NerdWallet publishes no public developer API,
  developer portal, or well-known API discovery surface; this profile captures its public identity
  and domain-security posture.'
